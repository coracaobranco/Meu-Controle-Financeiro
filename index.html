<header><h1>Meu Controle Financeiro</h1><button class="ghost" onclick="theme()" aria-label="Alternar tema">◐</button></header>
<main id="main"></main><nav id="nav"></nav><dialog id="dlg"></dialog><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script>const ST=['purchases','bills','income'];
const DB={db:null,
open(){return new Promise((res,rej)=>{const r=indexedDB.open('mcf',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s,{keyPath:'id',autoIncrement:true}));r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
tx(s,m,f){return new Promise((res,rej)=>{const t=this.db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
all(s){return this.tx(s,'readonly',o=>o.getAll())},get(s,id){return this.tx(s,'readonly',o=>o.get(id))},
put(s,v){return this.tx(s,'readwrite',o=>o.put(v))},del(s,id){return this.tx(s,'readwrite',o=>o.delete(id))},
restore(o){return new Promise((res,rej)=>{const t=this.db.transaction(ST,'readwrite');ST.forEach(s=>{const os=t.objectStore(s);os.clear();(o[s]||[]).forEach(v=>os.put(v))});t.oncomplete=res;t.onerror=()=>rej(t.error)})}};

const Scanner={
pick(cap,accept='image/*'){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=accept;if(cap)i.capture='environment';i.onchange=()=>r(i.files[0]);i.click()})},
shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};i.onerror=()=>rej(new Error('Imagem inválida'));i.src=u})},
async ocr(url,cb){if(!window.Tesseract)throw new Error('biblioteca de OCR indisponível (conecte-se à internet na primeira vez)');const r=await Tesseract.recognize(url,'por',{logger:m=>m.progress!=null&&cb&&cb(m.progress)});return r.data.text},
money(s){return(s.match(/\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}/g)||[]).map(x=>parseFloat(x.replace(/\./g,'').replace(',','.')))},
date(s){const m=(s||'').match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''},
parseNote(t){const L=t.split('\n').map(x=>x.trim()).filter(Boolean);
const store=L.find(l=>/[A-Za-zÀ-ú]{4,}/.test(l))||'',cnpj=(t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/)||[''])[0],time=(t.match(/\b([01]\d|2[0-3]):[0-5]\d/)||[''])[0];
let total=0;const items=[];
L.forEach(l=>{const v=this.money(l);if(/total/i.test(l)&&!/sub/i.test(l)&&v.length)total=Math.max(total,v[v.length-1]);
if(v.length<2||/total|troco|dinheiro|cart|cnpj|cpf|desconto|pagamento|tribut/i.test(l))return;
let name=l.split(/\s\d/)[0].replace(/^\d+\s*/,'').replace(/\b(KG|UN|LT|L|PC|CX|G|ML)\b\s*$/i,'').trim();if(name.length<3)return;
const tt=v[v.length-1],vu=v[v.length-2];items.push({name,qty:vu?Math.round(tt/vu*1000)/1000:1,unit:((l.match(/\b(KG|UN|LT|L|PC|CX|G|ML)\b/i)||[])[1]||'UN').toUpperCase().replace('LT','L'),vu,total:tt})});
if(!total)total=+items.reduce((s,i)=>s+i.total,0).toFixed(2);
const pay=/pix/i.test(t)?'Pix':/cr[eé]dito/i.test(t)?'Crédito':/d[eé]bito/i.test(t)?'Débito':/dinheiro/i.test(t)?'Dinheiro':'Outro';
return{store,cnpj,date:this.date(t),time,total,pay,items}},
parseBill(t){const low=t.toLowerCase();let type='outras';
[['agua',/[áa]gua|saneamento|sabesp|caesb|copasa|sanepar|esgoto/],['energia',/energia|kwh|cemig|enel|neoenergia|cpfl|equatorial|celesc/],['internet',/internet|fibra|banda larga/],['telefone',/telefon|celular/],['condominio',/condom[ií]nio/],['gas',/g[aá]s/],['aluguel',/alugu[eé]l/]].some(([k,r])=>r.test(low)&&(type=k,true));
const L=t.split('\n').map(x=>x.trim()).filter(Boolean),g=(r,i=1)=>(t.match(r)||[])[i]||'';
const company=L.find(l=>/[A-Za-zÀ-ú]{4,}/.test(l))||'';
const vl=L.find(l=>/venc/i.test(l)&&this.date(l)),due=vl?this.date(vl):this.date(t);
const il=L.find(l=>/emiss/i.test(l)&&this.date(l)),mr=t.match(/(?:refer[eê]ncia|m[eê]s)[^\d]{0,15}(\d{2})\s*[\/.-]\s*(\d{4})/i);
let value=0;L.forEach(l=>{if(/total|pagar|valor/i.test(l)){const v=this.money(l);if(v.length)value=Math.max(value,v[v.length-1])}});
if(!value)value=Math.max(0,...this.money(t));
const cons=type=='agua'?g(/(\d+(?:,\d+)?)\s*m[3³]/i):type=='energia'?g(/(\d+)\s*kwh/i):'';
return{type,company,holder:g(/(?:titular|cliente|nome)[:\s]+([^\n]{5,50})/i).trim(),value,due,issued:il?this.date(il):'',ref:mr?`${mr[2]}-${mr[1]}`:'',cons,
prev:g(/leitura anterior[^\d]{0,10}(\d+)/i),curr:g(/leitura atual[^\d]{0,10}(\d+)/i),barcode:(t.match(/(?:\d[\s.-]?){44,48}/)||[''])[0].trim(),inst:g(/(?:instala[cç][aã]o|unidade consumidora|\bUC\b)[^\d]{0,15}(\d{5,12})/i)}}};

const $=(s,r=document)=>r.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),ym=d=>(d||'').slice(0,7),num=v=>parseFloat(String(v).replace(',','.'))||0;
const fdate=s=>s?s.split('-').reverse().join('/'):'',g=(r,n)=>r.querySelector(`[name=${n}]`).value;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const BT={agua:'Água',energia:'Energia elétrica',internet:'Internet',telefone:'Telefone',aluguel:'Aluguel',condominio:'Condomínio',gas:'Gás',outras:'Outras contas'};
const CATI=['Salário','Trabalho extra','Serviços','Vendas','Outras entradas'],UN=['UN','KG','G','L','ML','PC','CX'],PAY=['Dinheiro','Pix','Débito','Crédito','Outro'];
const TABS=[['home','Início','🏠'],['purchases','Compras','🛒'],['bills','Contas','🧾'],['income','Receitas','💰'],['more','Mais','⚙️']];
let S={tab:'home',month:today().slice(0,7),q:'',charts:[]},dip;
const D=async()=>({p:await DB.all('purchases'),b:await DB.all('bills'),i:await DB.all('income')});
const prevM=m=>{let[y,o]=m.split('-').map(Number);o--;if(!o){o=12;y--}return y+'-'+String(o).padStart(2,'0')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',4500)};
const mpick=()=>`<input type="month" value="${S.month}" onchange="S.month=this.value||S.month;render()">`;
function theme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);render()}
function modal(title,body,save,label='Salvar'){const d=$('#dlg');d.innerHTML=`<form><h2>${title}</h2>${body}<div class="row"><button type="button" class="ghost" onclick="$('#dlg').close()">Cancelar</button>${save?`<button class="pri">${label}</button>`:''}</div></form>`;
d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{if(await save(e.target)!==false){d.close();render()}}catch(x){toast('Erro: '+x.message)}};d.showModal()}
async function render(){$('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" class="${S.tab==k?'on':''}"><span>${i}</span>${l}</button>`).join('');
S.charts.forEach(c=>c.destroy());S.charts=[];$('#main').innerHTML=await({home:vHome,purchases:vPurchases,bills:vBills,income:vIncome,more:vMore}[S.tab])();if(S.tab=='home')charts()}
function monthSum(d,m){const food=d.p.filter(x=>ym(x.date)==m).reduce((s,x)=>s+x.total,0),bt={};
d.b.filter(x=>x.paid&&ym(x.due)==m).forEach(x=>bt[x.type]=(bt[x.type]||0)+(x.paidValue||x.value));
const inc=d.i.filter(x=>ym(x.date)==m).reduce((s,x)=>s+x.value,0);return{food,bt,inc,exp:food+Object.values(bt).reduce((a,b)=>a+b,0)}}
async function vHome(){const d=await D(),s=monthSum(d,S.month),pm=monthSum(d,prevM(S.month));
const pend=d.b.filter(b=>!b.paid&&ym(b.due)==S.month),paid=d.b.filter(b=>b.paid&&ym(b.due)==S.month),late=d.b.filter(b=>!b.paid&&b.due<today()),al=[];
if(pm.exp>0&&s.exp>pm.exp*1.2)al.push(`Despesas ${((s.exp/pm.exp-1)*100).toFixed(0)}% acima do mês anterior`);
['agua','energia'].forEach(t=>{const a=s.bt[t]||0,b=pm.bt[t]||0;if(b&&a>b*1.15)al.push(`Conta de ${BT[t].toLowerCase()} subiu ${((a/b-1)*100).toFixed(0)}% vs. mês anterior`)});
if(late.length)al.push(`${late.length} conta(s) vencida(s) sem pagamento`);
const st={};d.p.filter(x=>ym(x.date)==S.month).forEach(x=>st[x.store]=(st[x.store]||0)+x.total);const top=Object.entries(st).sort((a,b)=>b[1]-a[1])[0];
const other=Object.entries(s.bt).filter(([k])=>!['agua','energia'].includes(k)).reduce((a,[,v])=>a+v,0);
const ms=[S.month];for(let i=0;i<5;i++)ms.unshift(prevM(ms[0]));const x=ms.map(m=>monthSum(d,m));
S.cd={cat:[s.food,s.bt.agua||0,s.bt.energia||0,other],ms,inc:x.map(a=>a.inc),exp:x.map(a=>a.exp)};
const K=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
return`<div class="row">${mpick()}</div>${al.map(a=>`<div class="alert">⚠️ ${a}</div>`).join('')}
<div class="grid">${K('Despesas',R(s.exp))}${K('Receitas',R(s.inc))}${K('Saldo',R(s.inc-s.exp))}${K('Pendentes',`${pend.length} · ${R(pend.reduce((a,b)=>a+b.value,0))}`)}${K('Pagas',paid.length+' conta(s)')}${K('Alimentação',R(s.food))}${K('Água',R(s.bt.agua||0))}${K('Energia',R(s.bt.energia||0))}${K('Outras categorias',R(other))}</div>
${top?`<div class="card"><div class="k">Estabelecimento com mais gastos</div><b>${esc(top[0])}</b> · ${R(top[1])}</div>`:''}
<div class="card"><canvas id="c1" height="200"></canvas></div><div class="card"><canvas id="c2" height="200"></canvas></div>`}
function charts(){if(!window.Chart)return;const c=S.cd;Chart.defaults.color=document.documentElement.dataset.theme=='dark'?'#ccc':'#444';
S.charts=[new Chart($('#c1'),{type:'doughnut',data:{labels:['Alimentação','Água','Energia','Outras'],datasets:[{data:c.cat,backgroundColor:['#111','#4a90d9','#e0a800','#999'],borderWidth:0}]},options:{plugins:{title:{display:true,text:'Despesas por categoria'},legend:{position:'bottom'}}}}),

const al=[];if(pm.exp>0&&s.exp>pm.exp*1.2)al.push(`Despesas ${((s.exp/pm.exp-1)*100).toFixed(0)}% acima do mês anterior`);
['agua','energia'].forEach(t=>{const a=s.bt[t]||0,b=pm.bt[t]||0;if(b&&a>b*1.15)al.push(`Conta de ${BT[t].toLowerCase()} subiu ${((a/b-1)*100).toFixed(0)}%`)});
return`<div class="hero"><div class="top"><div><h2>Olá, ${esc(localStorage.getItem('name'))}!</h2><p>${late.length?`Você tem ${late.length} conta(s) vencida(s) ⚠️`:'Seu controle está em dia. 👋'}</p></div><button class="x" onclick="go('more')" aria-label="Configurações">⚙</button></div></div>
<div class="pull"><div class="card bal"><div class="k">Saldo do Mês</div><div class="top"><div class="v big">${R(bal)}</div>${pct!=null?`<b class="${pct>=0?'ok':'late'}">${pct>=0?'↑':'↓'} ${Math.abs(pct).toFixed(0)}%</b>`:''}</div><div class="spark"><canvas id="c0"></canvas></div></div>
<div class="grid" style="margin-top:10px"><div class="card"><div class="ci g">↓</div><div class="k">Receitas</div><b>${R(s.inc)}</b></div><div class="card"><div class="ci r">↑</div><div class="k">Despesas</div><b>${R(s.exp)}</b></div></div>
<div class="row sm" style="margin-top:10px">${mpick()}<button class="ghost" onclick="go('bills')">Contas pendentes (${pend.length})</button></div>${al.map(a=>`<div class="alert">⚠️ ${a}</div>`).join('')}
<h3>Despesas por Categoria</h3><div class="card cat"><div><canvas id="c1"></canvas></div><ul class="lg">${cat.map(c=>`<li><i style="background:${c[2]}"></i>${c[0]}<b>${s.exp?Math.round(c[1]/tot*100):0}%</b></li>`).join('')}</ul></div></div>`}
function charts(){if(!window.Chart)return;const c=S.cd;
S.charts=[new Chart($('#c0'),{type:'line',data:{labels:c.ms,datasets:[{data:c.sp,borderColor:'#22c36b',backgroundColor:'#22c36b22',fill:true,tension:.4,pointRadius:0}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}}),
new Chart($('#c1'),{type:'doughnut',data:{datasets:[{data:c.cat.map(a=>a[1]),backgroundColor:c.cat.map(a=>a[2]),borderWidth:2}]},options:{cutout:'62%',plugins:{legend:{display:false}}}})]}
/* relatórios */
async function vReports(){const d=await D(),an=S.rep=='a',y=S.month.slice(0,4);let ms;
if(an)ms=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));else{ms=[S.month];for(let i=0;i<5;i++)ms.unshift(prevM(ms[0]))}
const x=ms.map(m=>monthSum(d,m)),use=an?x:[x[5]],tot=use.reduce((a,b)=>a+b.exp,0),pv=an?0:monthSum(d,prevM(S.month)).exp,ch=pv?(tot-pv)/pv*100:null;
const cats={'Alimentação':use.reduce((a,b)=>a+b.food,0)};use.forEach(o=>Object.entries(o.bt).forEach(([k,v])=>cats[BT[k]]=(cats[BT[k]]||0)+v));S.rd={ms,exp:x.map(a=>a.exp)};
return`<div class="bar"><span></span><b>Relatórios</b><span></span></div><div class="chips"><button class="${an?'':'on'}" onclick="S.rep='m';render()">Mensal</button><button class="${an?'on':''}" onclick="S.rep='a';render()">Anual</button></div><div class="row sm">${mpick()}</div>
<div class="card"><div class="k">Total de Despesas${an?' em '+y:''}</div><div class="top"><div class="v big">${R(tot)}</div>${ch!=null?`<b class="${ch<=0?'ok':'late'}">${ch<=0?'↓':'↑'} ${Math.abs(ch).toFixed(0)}%</b>`:''}</div><canvas id="c3" height="160"></canvas></div>
<h3>Por Categoria</h3>${Object.entries(cats).filter(([,v])=>v>0).map(([k,v])=>`<div class="card top"><b>${k}</b><b>${R(v)}</b></div>`).join('')||'<small>Sem despesas no período.</small>'}`}
function rcharts(){if(!window.Chart)return;const c=S.rd;S.charts=[new Chart($('#c3'),{type:'bar',data:{labels:c.ms.map(m=>m.slice(5)+'/'+m.slice(2,4)),datasets:[{data:c.exp,backgroundColor:'#22c36b',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{display:false}},x:{grid:{display:false}}}}})]}
/* contas */
async function vBills(){const d=await D(),f=S.bf||'all',map={agua:['agua'],luz:['energia'],internet:['internet','telefone']};
const L=d.b.filter(b=>!map[f]||map[f].includes(b.type)).sort((a,b)=>(a.paid-b.paid)||(a.paid?b.due.localeCompare(a.due):a.due.localeCompare(b.due)));
return hdr('Contas Domésticas',"go('home')")+`<div class="chips">${[['all','Todas'],['agua','Água'],['luz','Luz'],['internet','Internet']].map(([k,l])=>`<button class="${f==k?'on':''}" onclick="S.bf='${k}';render()">${l}</button>`).join('')}</div>
${L.map(b=>{const[t,c]=st(b);return`<div class="card bill"><div class="ico ${b.type}">${BI[b.type]}</div><div class="grow"><small>Conta de ${BT[b.type]}</small><b class="big2">${R(b.paid?b.paidValue:b.value)}</b><span class="pill ${c}">${t} · ${esc(b.company)}</span>${b.paid?`<small>${fdate(b.paidDate)}</small>`:`<small>Venc. ${fdate(b.due)}</small>`}${b.cons?`<small>Consumo: ${esc(b.cons)} ${b.type=='agua'?'m³':b.type=='energia'?'kWh':''}</small>`:''}</div>
<div class="row">${b.paid?`<button class="ghost" onclick="unpay(${b.id})">Pendente</button>`:`<button class="ghost" onclick="pay(${b.id})">Marcar paga</button>`}<button class="ghost" onclick="editB(${b.id})">Editar</button><button class="ghost" onclick="delRec('bills',${b.id})">Excluir</button></div></div>`}).join('')||'<p><small>Nenhuma conta registrada.</small></p>'}
<button class="blk cta" onclick="camScreen('b')">📷 Fotografar Conta</button>`}
/* calendário */
async function vCal(){const d=await D(),[y,mo]=S.month.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate(),by={};
d.b.filter(b=>ym(b.due)==S.month).forEach(b=>(by[+b.due.slice(8)]=by[+b.due.slice(8)]||[]).push(b));
let cells=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(s=>`<span class="dow">${s}</span>`).join('')+'<i></i>'.repeat(first);
for(let k=1;k<=n;k++){const ds=S.month+'-'+String(k).padStart(2,'0'),l=by[k]||[];cells+=`<button class="day ${ds==today()?'td':''} ${S.day==ds?'sel':''}" onclick="S.day=S.day=='${ds}'?null:'${ds}';render()">${k}${l.length?`<u class="${l.some(b=>!b.paid)?(ds<today()?'late':'pend'):'ok'}"></u>`:''}</button>`}
const L=S.day?d.b.filter(b=>b.due==S.day):d.b.filter(b=>!b.paid&&b.due>=today()).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
return hdr('Calendário Financeiro',"go('home')")+`<div class="card"><div class="mh"><button onclick="S.month=prevM(S.month);S.day=null;render()">‹</button><b>${new Date(y,mo-1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button onclick="S.month=nextM(S.month);S.day=null;render()">›</button></div><div class="cal">${cells}</div></div>
<h3>${S.day?'Contas de '+fdate(S.day):'Próximas Contas'}</h3>${L.map(b=>`<div class="card top" onclick="editB(${b.id})"><span class="ico ${b.type}">${BI[b.type]}</span><span class="grow"><b>${BT[b.type]} - ${esc(b.company)}</b><small>${st(b)[0]}</small></span><b>${R(b.value)}</b></div>`).join('')||'<small>Nenhuma conta.</small>'}`}
/* preços */
async function vPrices(){const d=await D(),m={};d.p.forEach(p=>p.items.forEach(i=>{const k=norm(i.name);(m[k]=m[k]||{name:i.name,h:[]}).h.push({date:p.date,vu:i.vu,unit:i.unit})}));Object.values(m).forEach(o=>o.h.sort((a,b)=>a.date.localeCompare(b.date)));
if(S.prod&&m[S.prod]){const h=m[S.prod].h,l=h[h.length-1],pr=h[h.length-2];S.ph=h;const df=pr?l.vu-pr.vu:0,pc=pr?df/pr.vu*100:0;
return hdr('Histórico de Preços',"S.prod=null;render()")+`<div class="card"><h2>${esc(m[S.prod].name)}</h2><small>Preço por ${l.unit.toLowerCase()}</small>${pr?`<div class="banner ${df>0?'late':'ok'}">${df>0?'↑ Aumento':'↓ Redução'} de ${Math.abs(pc).toFixed(1)}%<br><small>${R(pr.vu)} → ${R(l.vu)}</small></div>`:'<div class="banner">Primeira compra registrada: '+R(l.vu)+'</div>'}<canvas id="c4" height="180"></canvas></div>`}
return hdr('Histórico de Preços',"go('purchases')")+(Object.entries(m).map(([k,o])=>{const h=o.h,l=h[h.length-1],pr=h[h.length-2],df=pr?l.vu-pr.vu:0;return`<div class="card top" onclick="S.prod='${k}';render()"><b>${esc(o.name)}</b><span>${R(l.vu)}/${l.unit.toLowerCase()} ${pr?`<b class="${df>0?'late':'ok'}">${df>0?'↑':'↓'}</b>`:''}</span></div>`}).join('')||'<p><small>Registre compras para acompanhar os preços.</small></p>')}
function pchart(){if(!window.Chart)return;S.charts=[new Chart($('#c4'),{type:'line',data:{labels:S.ph.map(h=>fdate(h.date).slice(0,5)),datasets:[{data:S.ph.map(h=>h.vu),borderColor:'#e5484d',backgroundColor:'#e5484d18',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}}}})]}
/* mais */
const _vp=vPurchases;vPurchases=async()=>`<button class="ghost" style="width:100%" onclick="go('prices')">📈 Histórico de Preços</button>`+await _vp();
const _vi=vIncome;vIncome=async()=>hdr('Receitas',"go('more')")+await _vi();
function backupSheet(){modal('Backup dos Dados','<p><small>⚠️ Seus dados ficam só neste aparelho, sem criptografia. Faça backups periódicos.</small></p><div class="col"><button class="blk" type="button" onclick="exportJSON()">Exportar backup (JSON)</button><button class="ghost" type="button" onclick="$(\'#dlg\').close();imp()">Importar backup</button><button class="ghost" type="button" onclick="exportCSV()">Exportar relatório (CSV)</button></div>',null)}
async function vMore(){const dk=document.documentElement.dataset.theme=='dark',row=(i,t,s,a)=>`<button class="set" onclick="${a}"><span class="si">${i}</span><span class="grow"><b>${t}</b><small>${s}</small></span><span>›</span></button>`;
return`<div class="bar"><span></span><b>Configurações</b><span></span></div>`+row('🧾','Contas Domésticas','Água, luz, internet…',"go('bills')")+row('📅','Calendário Financeiro','Vencimentos do mês',"go('cal')")+row('📈','Histórico de Preços','Preço por produto',"go('prices')")+row('💰','Receitas','Salário, serviços…',"go('income')")+row('☁️','Backup dos Dados','Exportar ou importar',"backupSheet()")
+`<div class="set"><span class="si">🌙</span><span class="grow"><b>Modo Escuro</b><small>Alterar aparência</small></span><label class="sw"><input type="checkbox" ${dk?'checked':''} onchange="theme()"><i></i></label></div>`+row('📲','Instalar aplicativo','Na tela inicial',"inst()")+row('🗑','Apagar todos os dados','Não há como desfazer',"wipe()")+row('ℹ️','Sobre o App','Versão 1.1 · dados só neste aparelho',"toast('Seus dados ficam apenas neste aparelho, sem criptografia. Faça backups.')")+`<button class="blk cta2" onclick="exportJSON()">Fazer Backup Agora</button>`}

</script></body></html>
